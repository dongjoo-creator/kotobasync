    // 한자 포함 여부 판별 (순수 히라가나/가타카나 단어는 중복 후리가나 표시 안 함)
    function hasKanjiCharacter(text) {
      if (!text) return false;
      return /[\u4E00-\u9FAF\u3400-\u4DBF々]/.test(text);
    }

    // TTS 재생 및 검색용 브래킷 제거
    function stripFuriganaBrackets(text) {
      if (!text) return '';
      return text.replace(/\[([^\]]+)\]/g, '');
    }

    // AI가 잘못 생성한 후리가나 포맷(조사 뒤 [조사], 오쿠리가나 뒤 [전체발음], 불필요한 공백 등)을 자동 교정
    function normalizeJapaneseFurigana(text) {
      if (!text || typeof text !== 'string') return '';
      let s = text.trim();

      // 1) 한자+히라가나(오쿠리가나)[전체후리가나] 형태 교정 (예: 詳しく[くわしく] -> 詳[くわ]しく, 書か[か] -> 書か)
      s = s.replace(/([\u4E00-\u9FAF\u3400-\u4DBF々ヶ]+)([\u3040-\u309F]+)\[([^\]]+)\]/g, (full, kanjiPart, okurigana, reading) => {
        const cleanReading = reading.trim();
        if (cleanReading === okurigana) {
          return kanjiPart + okurigana;
        }
        if (cleanReading.endsWith(okurigana) && cleanReading.length > okurigana.length) {
          const kanjiReading = cleanReading.slice(0, cleanReading.length - okurigana.length);
          return `${kanjiPart}[${kanjiReading}]${okurigana}`;
        }
        return `${kanjiPart}[${cleanReading}]${okurigana}`;
      });

      // 2) 한자가 아닌 글자(히라가나, 가타카나, 한글, 문장부호, 공백) 바로 뒤에 붙은 잘못된 [후리가나] 제거 (예: の[の], には[には], 。[いる。])
      s = s.replace(/(^|[^\u4E00-\u9FAF\u3400-\u4DBF々ヶ\]])\[([^\]]+)\]/g, '$1');

      // 3) 한자[후리가나] 앞뒤에 AI가 잘못 넣은 불필요한 반각 공백 제거
      s = s.replace(/\s+(?=[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF\u3400-\u4DBF々ヶ。、！？])/g, '');

      return s;
    }

    // 한자 위에만 작게 후리가나(<ruby>) 렌더링 헬퍼
    function renderJapaneseWithFurigana(rawText, { fallbackKana = '', hideFurigana = false } = {}) {
      if (!rawText) return null;
      const text = normalizeJapaneseFurigana(rawText);
      const rtClass = hideFurigana
        ? 'invisible opacity-0 transition-opacity duration-150'
        : 'opacity-100 transition-opacity duration-150';

      // 1) 문장 내 `한자[후리가나]` 포맷 파싱
      if (text.includes('[') && text.includes(']')) {
        const regex = /([\u4E00-\u9FAF\u3400-\u4DBF々ヶ]+)\[([^\]]+)\]/g;
        const elements = [];
        let lastIndex = 0;
        let match;
        while ((match = regex.exec(text)) !== null) {
          if (match.index > lastIndex) {
            elements.push(<span key={`t-${lastIndex}`}>{text.slice(lastIndex, match.index)}</span>);
          }
          elements.push(
            <ruby key={`r-${match.index}`} className="mx-[0.5px]">
              {match[1]}
              <rt className={rtClass}>{match[2]}</rt>
            </ruby>
          );
          lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) {
          elements.push(<span key="t-end">{text.slice(lastIndex)}</span>);
        }
        if (elements.length > 0) return <>{elements}</>;
      }

      // 2) 단일 표제어에 한자가 포함되어 있고 fallbackKana가 있을 때 오쿠리가나(어미)를 분리해 한자 위에만 후리가나 표시
      if (fallbackKana && hasKanjiCharacter(text) && text !== fallbackKana) {
        let suffixLen = 0;
        while (
          suffixLen < text.length &&
          suffixLen < fallbackKana.length &&
          text[text.length - 1 - suffixLen] === fallbackKana[fallbackKana.length - 1 - suffixLen] &&
          !hasKanjiCharacter(text[text.length - 1 - suffixLen])
        ) {
          suffixLen++;
        }
        let prefixLen = 0;
        while (
          prefixLen < text.length - suffixLen &&
          prefixLen < fallbackKana.length - suffixLen &&
          text[prefixLen] === fallbackKana[prefixLen] &&
          !hasKanjiCharacter(text[prefixLen])
        ) {
          prefixLen++;
        }
        const prefix = text.slice(0, prefixLen);
        const kanjiCore = text.slice(prefixLen, text.length - suffixLen);
        const suffix = text.slice(text.length - suffixLen);
        const kanaCore = fallbackKana.slice(prefixLen, fallbackKana.length - suffixLen);

        if (kanjiCore && kanaCore) {
          return (
            <>
              {prefix && <span>{prefix}</span>}
              <ruby className="mx-[0.5px]">
                {kanjiCore}
                <rt className={rtClass}>{kanaCore}</rt>
              </ruby>
              {suffix && <span>{suffix}</span>}
            </>
          );
        }
      }

      // 3) 한자가 없는 히라가나/가타카나 단어는 그대로 표시 (우측에 중복 히라가나 표기 없음)
      return <span>{text}</span>;
    }

      const fetchSecretGeminiKeyFromVault = async (dbInstance) => {
        try {
          // 1) 빠른 REST 조회 (SDK 초기화 대기 없이 0.3초 내 즉시 조회)
          const restCtrl = new AbortController();

          const restUrl = `https://firestore.googleapis.com/v1/projects/${DEFAULT_FIREBASE_PROJECT_ID}/databases/(default)/documents/kotobasync_config/admin_secrets`;
          const restRes = await fetch(restUrl, { signal: restCtrl.signal }).catch(() => null);

            const restJson = await restRes.json();

            timeoutPromise
          ]);
          if (docSnap && docSnap.exists) {
            const data = docSnap.data();
            if (data && data.geminiApiKey) {
              const fetchedKey = data.geminiApiKey.trim();
              setConfig(prev => {

                try {
                  localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(updated));

                return updated;

      }, [config.firebaseProjectId, config.firebaseApiKey]);

      const filteredAndSortedWords = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        const filtered = words.filter(w => {
          if (statusFilter === 'favorite' && !w.is_favorite) return false;

          return (

        return [...filtered].sort((a, b) => {

      const selectedWord = useMemo(

      const updateWordItem = async (updated) => {

      const deleteWordItem = async (id) => {

      // Gemini API 사용 가능 모델 자동 탐색(ListModels) 및 초고속 호출 헬퍼
      async function callGeminiJSON(apiKey, prompt, temperature = 0.3) {
        const cleanKey = (apiKey || '').trim();
        if (!cleanKey) {
          throw new Error('NO_API_KEY');
        }

        const WORKING_MODEL_KEY = 'kotobasync_working_model_v2';
        if (!window._kotobaDeadModels) {
          window._kotobaDeadModels = new Set(['gemini-2.5-flash-lite', 'gemini-2.0-flash-lite', 'gemini-1.5-flash']);
        }
        if (!window._kotobaWorkingModel) {
          try {
            const savedModel = localStorage.getItem(WORKING_MODEL_KEY);
            if (savedModel && !window._kotobaDeadModels.has(savedModel)) {
              window._kotobaWorkingModel = savedModel;
            }
          } catch {}
        }

        // 1. ListModels 네트워크 왕복 시간을 아끼기 위해 가장 빠른 초고속 모델(gemini-3.5-flash-lite)을 즉시 1순위로 배치
        let modelsToTry = [];
        if (window._kotobaWorkingModel && !window._kotobaDeadModels.has(window._kotobaWorkingModel)) {
          modelsToTry.push(window._kotobaWorkingModel);
        }

        for (const fastModel of ['gemini-3.5-flash-lite', 'gemini-flash-lite-latest', 'gemini-3.5-flash', 'gemini-flash-latest']) {
          if (!modelsToTry.includes(fastModel) && !window._kotobaDeadModels.has(fastModel)) {
            modelsToTry.push(fastModel);
          }
        }

        // 만약 기본 모델들이 모두 실패한 적이 있을 때만 ListModels 조회 수행
        if (modelsToTry.length === 0) {
          try {
            const listCtrl = new AbortController();
            const listTimer = setTimeout(() => listCtrl.abort(), 4000);
            const listRes = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`,
              { signal: listCtrl.signal }
            );
            clearTimeout(listTimer);

            if (listRes.ok) {
              const listData = await listRes.json();
              const available = (listData.models || [])
                .filter(
                  (m) =>
                    Array.isArray(m.supportedGenerationMethods) &&
                    m.supportedGenerationMethods.includes('generateContent') &&
                    m.name.includes('gemini') &&
                    !m.name.includes('vision') &&
                    !m.name.includes('embedding') &&
                    !m.name.includes('imagen') &&
                    !m.name.includes('tts') &&
                    !m.name.includes('audio') &&
                    !m.name.includes('thinking') &&
                    !m.name.includes('robotics') &&
                    !m.name.includes('computer-use')
                )
                .map((m) => m.name.replace(/^models\//, ''))
                .filter((name) => !window._kotobaDeadModels.has(name));

              // 추론(Thinking) 지연이 없는 초고속 lite 계열 3.5 모델을 1순위로 정렬
              const getModelScore = (name) => {
                if (name === 'gemini-3.5-flash-lite') return 100;
                if (name === 'gemini-flash-lite-latest') return 99;
                if (name === 'gemini-3.5-flash') return 98;
                if (name.startsWith('gemini-3.5-flash')) return 97;
                if (name === 'gemini-flash-latest') return 95;
                if (name.includes('3.5') && name.includes('flash')) return 90;
                if (name.includes('flash')) return 70;
                return 10;
              };

              available.sort((a, b) => {
                const sa = getModelScore(a);
                const sb = getModelScore(b);
                if (sa !== sb) return sb - sa;
                return b.localeCompare(a);
              });

              window._kotobaCachedModels = available;
              for (const m of available) {
                if (!modelsToTry.includes(m)) modelsToTry.push(m);
              }
            }
          } catch (listErr) {}
        }

        // 최대 4개 후보 모델까지 빠르게 시도
        modelsToTry = modelsToTry.slice(0, 4);

        let lastErrorMsg = '';
        for (const model of modelsToTry) {
          const reqCtrl = new AbortController();
          const reqTimer = setTimeout(() => reqCtrl.abort(), 12000);
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cleanKey)}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              signal: reqCtrl.signal,
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature },
              }),
            });
            clearTimeout(reqTimer);

            if (res.ok) {
              const data = await res.json();
              const parts = data?.candidates?.[0]?.content?.parts || [];
              const textPart = [...parts].reverse().find(p => p.text && !p.thought) || parts[parts.length - 1] || {};
              const rawText = textPart.text || '';

              // JSON 배열([...]) 또는 JSON 객체({...})를 후리가나 대괄호([후리가나])와 혼동하지 않고 정확히 추출
              const cleaned = rawText.replace(/```json\s*|```\s*/gi, '').trim();
              const firstBracket = cleaned.indexOf('[');
              const firstBrace = cleaned.indexOf('{');
              let targetStr = cleaned;

              if (firstBracket !== -1 && (firstBrace === -1 || firstBracket < firstBrace)) {
                const lastBracket = cleaned.lastIndexOf(']');
                if (lastBracket > firstBracket) {
                  targetStr = cleaned.slice(firstBracket, lastBracket + 1);
                }
              } else if (firstBrace !== -1) {
                const lastBrace = cleaned.lastIndexOf('}');
                if (lastBrace > firstBrace) {
                  targetStr = cleaned.slice(firstBrace, lastBrace + 1);
                }
              }

              if (targetStr) {
                const parsed = JSON.parse(targetStr);
                window._kotobaWorkingModel = model;
                try {
                  localStorage.setItem(WORKING_MODEL_KEY, model);
                } catch {}
                return parsed;
              }
            } else {
              const errJson = await res.json().catch(() => ({}));
              const msg = errJson?.error?.message || `HTTP ${res.status}`;
              lastErrorMsg = msg;
              // 신규 사용자에게 중단된 구형 모델이거나 404/400인 경우 즉시 제외 목록에 등록하고 다음 최신 모델로 진행
              if (res.status === 404 || res.status === 400 || msg.includes('no longer available') || msg.includes('not found')) {
                window._kotobaDeadModels.add(model);
                if (window._kotobaWorkingModel === model) {
                  window._kotobaWorkingModel = null;
                  try {
                    localStorage.removeItem(WORKING_MODEL_KEY);
                  } catch {}
                }
              }
            }
          } catch (err) {
            clearTimeout(reqTimer);
            lastErrorMsg = err?.name === 'AbortError' ? '응답 시간 초과' : (err?.message || '파싱 오류');
          }
        }
        throw new Error(lastErrorMsg || '사용 가능한 Gemini 모델을 찾지 못했습니다.');
      }

      // 상단 메인 입력창: AI 후보 제안 및 즉시 추가
      const handleQuickAddSearch = async (overrideQuery) => {
        const q = (overrideQuery ?? addInput).trim();
        if (!q) return;
        if (overrideQuery) setAddInput(overrideQuery);

        // 최근 검색한 단어 목록 업데이트 (최대 6개 유지)
        setRecentSearches(prev => {
          const next = [q, ...prev.filter(item => item !== q)].slice(0, 6);
          try {
            localStorage.setItem('kotobasync_recent_searches_v1', JSON.stringify(next));
          } catch {}
          return next;
        });

        setIsSearchingAI(true);
        setIsAddDrawerOpen(true);

        let activeApiKey = (config.geminiApiKey || '').trim();
        if (!activeApiKey) {
          try {
            const savedCfg = JSON.parse(localStorage.getItem(STORAGE_KEY_CONFIG) || '{}');
            activeApiKey = (savedCfg.geminiApiKey || '').trim();
          } catch {}
        }
        if (!activeApiKey) {
          activeApiKey = await fetchSecretGeminiKeyFromVault(dbRef.current);
        }

        try {
          if (activeApiKey) {
            const prompt = `일본어 단어장 추가 요청: "${q}"
이에 해당하는 가장 핵심적인 일본어 단어 1개(동음이의어가 뚜렷할 때만 최대 2개)를 제안하세요.
[규칙]
1. 예문(japanese)에는 절대 한글을 섞지 말고 100% 일본어로만 간결하게(25자 이내) 작성하세요.
2. 대괄호 [후리가나]는 오직 한자 바로 뒤에, 그 한자의 히라가나 독음만 표기하세요(조사·히라가나 어미 뒤에는 절대 붙이지 말 것. 예: 詳[くわ]しく).
3. 각 뜻당 대표 예문 1개씩만 포함하여 JSON 배열([{ "kanji": "", "kana": "", "nuance": "", "meanings": [{ "partOfSpeech": "", "definition": "", "examples": [{ "japanese": "", "korean": "" }] }] }])로만 응답하세요.`;
            const parsed = await callGeminiJSON(activeApiKey, prompt, 0.25);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const sanitized = parsed.map(cand => ({
                ...cand,
                meanings: (cand.meanings || []).map(m => ({
                  ...m,
                  examples: (m.examples || []).map(ex => ({
                    ...ex,
                    japanese: normalizeJapaneseFurigana(ex.japanese || ''),
                  })),
                })),
              }));
              setCandidates(sanitized);
              selectCandidate(sanitized[0], 0);
              setIsSearchingAI(false);
              return;
            }
          }

          const found = FALLBACK_PRONUNCIATION_DICT[q] || [{
            kanji: q,
            kana: q,
            nuance: activeApiKey
              ? 'AI 응답을 가져오지 못했습니다. 아래에서 직접 확인 후 저장하세요.'
              : '우측 상단 [⚙️ 설정]에서 Gemini API 키를 입력하고 [설정 저장]을 누르면 모든 입력을 자동 변환합니다.',
            meanings: [{ partOfSpeech: '명사', definition: `${q}의 뜻`, examples: [{ japanese: `${q}を使[つか]った例文[れいぶん]です。`, korean: `${q}을(를) 사용한 예문입니다.` }] }]
          }];
          setCandidates(found);
          selectCandidate(found[0], 0);
        } catch (err) {
          const found = FALLBACK_PRONUNCIATION_DICT[q] || [{
            kanji: q,
            kana: q,
            nuance: `⚠️ Gemini API 호출 오류: ${err.message}. 우측 상단 [⚙️ 설정]에서 API 키가 정확한지 확인해 주세요.`,
            meanings: [{ partOfSpeech: '명사', definition: `${q}의 뜻`, examples: [{ japanese: `${q}を使[つか]った例文[れいぶん]です。`, korean: `${q}을(를) 사용한 예문입니다.` }] }]
          }];
          setCandidates(found);
          selectCandidate(found[0], 0);
        } finally {
          setIsSearchingAI(false);
        }
      };

      const selectCandidate = (cand, idx) => {
        setSelectedCandIdx(idx);
        setNewKanji(cand.kanji);
        setNewKana(cand.kana);
        setNewMeanings(cand.meanings.map((m, i) => ({
          id: `m-${Date.now()}-${i}`,
          partOfSpeech: m.partOfSpeech,
          definition: m.definition,
          examples: (m.examples || []).map((ex, j) => ({ id: `ex-${Date.now()}-${i}-${j}`, japanese: ex.japanese, korean: ex.korean }))
        })));
      };

      const handleSaveNewWord = async (e) => {
        if (e) e.preventDefault();
        if (!newKanji.trim()) return;
        const nowIso = new Date().toISOString();
        const item = {
          id: `word-${Date.now()}`,
          kanji: newKanji.trim(),
          kana: newKana.trim() || stripFuriganaBrackets(newKanji.trim()),
          meanings: newMeanings.filter(m => m.definition.trim()),
          memorization_status: 'learning',
          is_favorite: false,
          created_at: nowIso,
          updated_at: nowIso,
        };
        // 새로 추가한 단어가 항상 가장 위에 표시되도록 최신순('latest')으로 전환 후 맨 앞에 추가
        setSortBy('latest');
        if (statusFilter === 'memorized' || statusFilter === 'favorite') {
          setStatusFilter('all');
        }
        setWords(prev => [item, ...prev]);
        setSelectedWordId(item.id);
        if (dbRef.current) {
          await dbRef.current.collection(getCollectionPath()).doc(item.id).set(item).catch(() => {});
        }
        setIsAddDrawerOpen(false);
        setAddInput('');
        setCandidates([]);
      };

      // 특정 뜻에 대한 AI 예문 자동 생성 (한자[후리가나] 포맷)
      const handleGenerateAIExample = async (meaning) => {
        if (!selectedWord) return;
        setGeneratingMeaningId(meaning.id);
        try {
          const rubyWord = hasKanjiCharacter(selectedWord.kanji) && selectedWord.kanji !== selectedWord.kana
            ? `${selectedWord.kanji}[${selectedWord.kana}]`
            : selectedWord.kanji;

          let generated = {
            japanese: `「${rubyWord}」は日常会話[にちじょうかいわ]でもよく使[つか]われます。`,
            korean: `'${selectedWord.kanji}'는 '${meaning.definition}'(이)라는 의미로 일상 회화에서도 자주 쓰입니다.`
          };

          let activeApiKey = (config.geminiApiKey || '').trim();
          if (!activeApiKey) {
            try {
              const savedCfg = JSON.parse(localStorage.getItem(STORAGE_KEY_CONFIG) || '{}');
              activeApiKey = (savedCfg.geminiApiKey || '').trim();
            } catch {}
          }
          if (!activeApiKey) {
            activeApiKey = await fetchSecretGeminiKeyFromVault(dbRef.current);
          }

          if (activeApiKey) {
            const buildExamplePrompt = (extraWarning = '') => `일본어 단어 "${selectedWord.kanji}"(독음: "${selectedWord.kana}")의 뜻 중 "${meaning.definition}" 의미로 쓰인 자연스러운 일본어 예문 1개를 생성하세요.
[절대 규칙]
1. "japanese" 필드에는 절대 한글(한국어)을 단 한 글자도 쓰지 마세요! 반드시 100% 일본어(한자, 히라가나, 가타카나)로만 문장을 작성하세요. (한국어 단어를 섞으면 안 됩니다!)
2. 대괄호 [후리가나]는 오직 한자(Kanji) 바로 뒤에, 그 한자의 히라가나 발음만 적으세요. 조사(の, には, が, を 등)나 히라가나 어미(오쿠리가나) 뒤에는 절대 대괄호를 붙이지 마세요!
   - 올바른 예: "請求書[せいきゅうしょ]には、費用[ひよう]の内訳[うちわけ]が詳[くわ]しく書[か]かれている。"
   - 잘못된 예(절대 금지): "구입[こうにゅう]한..." 또는 "詳しく[くわしく]" 또는 "の[の]"
3. 띄어쓰기(공백) 없이 자연스러운 일본어 문장으로 작성하고 JSON({"japanese": "", "korean": ""})으로만 응답하세요.${extraWarning}`;

            let parsed = await callGeminiJSON(activeApiKey, buildExamplePrompt(), 0.4);
            // 만약 AI가 실수로 japanese 필드에 한글을 섞었다면 즉시 1회 재요청하여 순수 일본어 문장으로 교정
            if (parsed && parsed.japanese && /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(parsed.japanese)) {
              parsed = await callGeminiJSON(
                activeApiKey,
                buildExamplePrompt(`\n⚠️ 방금 응답("${parsed.japanese}")에 한글이 섞여 있었습니다! 한글을 전부 일본어 한자/히라가나로 번역하여 100% 일본어 문장으로만 다시 작성하세요.`),
                0.2
              );
            }
            if (parsed && parsed.japanese) {
              generated = {
                japanese: normalizeJapaneseFurigana(parsed.japanese),
                korean: parsed.korean || generated.korean,
              };
            }
          }

          const newEx = { id: `ex-${Date.now()}`, ...generated };
          const updatedMeanings = selectedWord.meanings.map(m =>
            m.id === meaning.id ? { ...m, examples: [...m.examples, newEx] } : m
          );
          await updateWordItem({ ...selectedWord, meanings: updatedMeanings });
        } catch (err) {
          alert(`AI 예문 생성 오류: ${err.message}`);
        } finally {
          setGeneratingMeaningId(null);
        }
      };

      const memorizedCount = words.filter(w => w.memorization_status === 'memorized').length;

      const renderDetailCard = (targetWord, isInlineMobile = false) => {
        if (!targetWord) return null;
        return (
          <div className={`rounded-2xl border border-indigo-200 bg-white p-4 sm:p-5 shadow-sm ${isInlineMobile ? 'border-l-4 border-l-indigo-600 bg-indigo-50/10' : ''}`}>
            <div className="border-b border-slate-100 pb-4">
              {isEditingHeader ? (
                <div className="space-y-2 rounded-xl bg-slate-50 p-3">
                  <div className="grid grid-cols-2 gap-2">
                    <input value={editKanji} onChange={e => setEditKanji(e.target.value)} className="rounded border px-2 py-1 font-jp text-sm font-bold" placeholder="일본어 표기" />
                    <input value={editKana} onChange={e => setEditKana(e.target.value)} className="rounded border px-2 py-1 font-jp text-sm" placeholder="히라가나 독음" />
                  </div>
                  <div className="flex justify-end gap-1.5">
                    <button onClick={() => setIsEditingHeader(false)} className="rounded bg-white px-2.5 py-1 text-xs border">취소</button>
                    <button
                      onClick={() => {
                        updateWordItem({ ...targetWord, kanji: editKanji, kana: editKana });
                        setIsEditingHeader(false);
                      }}
                      className="rounded bg-indigo-600 px-3 py-1 text-xs font-bold text-white"
                    >
                      저장
                    </button>
                  </div>
                </div>
              ) : (
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <h2 className="font-jp text-2xl sm:text-3xl font-black leading-relaxed text-slate-900">
                      {renderJapaneseWithFurigana(targetWord.kanji, { fallbackKana: targetWord.kana, hideFurigana })}
                    </h2>
                    <button onClick={() => speakJapanese(targetWord.kana || targetWord.kanji)} className="rounded-lg bg-indigo-50 px-2 py-1 text-xs text-indigo-600">🔊</button>
                  </div>
                  <div className="flex items-center gap-1">
                    <button
                      onClick={() => updateWordItem({ ...targetWord, memorization_status: targetWord.memorization_status === 'memorized' ? 'learning' : 'memorized' })}
                      className={`rounded-full border px-2.5 py-1 text-xs font-bold ${targetWord.memorization_status === 'memorized' ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-amber-200 bg-amber-50 text-amber-700'}`}
                    >
                      {targetWord.memorization_status === 'memorized' ? '✅ 암기완료' : '⏳ 학습중'}
                    </button>
                    <button onClick={() => setIsEditingHeader(true)} className="rounded-lg border px-2 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-50" title="표기 수정">✏️</button>
                    <button onClick={() => deleteWordItem(targetWord.id)} className="rounded-lg border border-rose-200 px-2 py-1 text-xs font-semibold text-rose-600 hover:bg-rose-50" title="삭제">🗑️</button>
                    {isInlineMobile && (
                      <button
                        onClick={() => setSelectedWordId(null)}
                        className="rounded-lg bg-slate-100 px-2 py-1 text-xs font-bold text-slate-500 hover:bg-slate-200 lg:hidden"
                        title="상세 접기"
                      >
                        ▲ 접기
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>

            {/* 다의어 뜻 및 AI 예문 목록 */}
            <div className="mt-4 space-y-4">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-500">다의어 뜻 & AI 예문 ({targetWord.meanings.length}개 뜻)</span>
                <button onClick={() => setIsAddingMeaning(!isAddingMeaning)} className="rounded-lg bg-indigo-50 px-2.5 py-1 text-xs font-bold text-indigo-600">+ 새 뜻 추가</button>
              </div>

              {isAddingMeaning && (
                <div className="space-y-2 rounded-xl border border-indigo-200 bg-indigo-50/40 p-3">
                  <div className="grid grid-cols-3 gap-2">
                    <input value={addMeaningPos} onChange={e => setAddMeaningPos(e.target.value)} placeholder="품사" className="rounded border bg-white px-2 py-1 text-xs" />
                    <input value={addMeaningDef} onChange={e => setAddMeaningDef(e.target.value)} placeholder="새로운 한국어 뜻 입력" className="col-span-2 rounded border bg-white px-2 py-1 text-xs font-bold" />
                  </div>
                  <div className="flex justify-end gap-1.5">
                    <button onClick={() => setIsAddingMeaning(false)} className="rounded bg-white px-2.5 py-1 text-xs border">취소</button>
                    <button
                      onClick={() => {
                        if (!addMeaningDef.trim()) return;
                        const nextM = [...targetWord.meanings, { id: `m-${Date.now()}`, partOfSpeech: addMeaningPos, definition: addMeaningDef.trim(), examples: [] }];
                        updateWordItem({ ...targetWord, meanings: nextM });
                        setAddMeaningDef('');
                        setIsAddingMeaning(false);
                      }}
                      className="rounded bg-indigo-600 px-3 py-1 text-xs font-bold text-white"
                    >
                      추가
                    </button>
                  </div>
                </div>
              )}

              {targetWord.meanings.map((meaning, mIdx) => (
                <div key={meaning.id || mIdx} className="rounded-2xl border border-slate-200 bg-slate-50/60 p-4">
                  <div className="flex flex-wrap items-start justify-between gap-2">
                    <div>
                      <span className="rounded bg-slate-200 px-1.5 py-0.5 text-[11px] font-bold text-slate-700">뜻 {mIdx + 1} · {meaning.partOfSpeech}</span>
                      <h4 className="mt-1 text-base font-extrabold text-slate-900">{meaning.definition}</h4>
                    </div>
                    <button
                      disabled={generatingMeaningId === meaning.id}
                      onClick={() => handleGenerateAIExample(meaning)}
                      className="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-3 py-1.5 text-xs font-bold text-white shadow-sm hover:opacity-95 disabled:opacity-50"
                    >
                      {generatingMeaningId === meaning.id ? '⏳ 생성 중...' : '✨ AI 예문 생성'}
                    </button>
                  </div>

                  <div className="mt-3 space-y-2 border-t border-slate-200/70 pt-3">
                    {meaning.examples.map(ex => (
                      <div key={ex.id} className="rounded-xl border border-slate-200 bg-white p-3">
                        <div className="flex items-start justify-between gap-2">
                          <div className="space-y-1">
                            <p className="font-jp text-sm font-bold leading-relaxed text-slate-900">
                              {renderJapaneseWithFurigana(ex.japanese, { hideFurigana })}
                            </p>
                            <p className="text-xs font-medium text-slate-600">{ex.korean}</p>
                          </div>
                          <div className="flex gap-1">
                            <button onClick={() => speakJapanese(ex.japanese)} className="text-xs text-slate-400 hover:text-indigo-600">🔊</button>
                            <button
                              onClick={() => {
                                const nextM = targetWord.meanings.map(m =>
                                  m.id === meaning.id ? { ...m, examples: m.examples.filter(item => item.id !== ex.id) } : m
                                );
                                updateWordItem({ ...targetWord, meanings: nextM });
                              }}
                              className="text-xs text-slate-400 hover:text-rose-600"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen flex flex-col pb-16">
          {/* 상단 고정 헤더 (세로 폭을 슬림하게 축소하고 불필요한 배지/문구 제거) */}
          <header className="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur-md">
            <div className="mx-auto flex max-w-7xl items-center justify-between px-3.5 py-2 sm:px-6 lg:px-8">
              <div className="flex items-center gap-2">
                <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white shadow-xs">
                  語
                </div>
                <h1 className="text-base font-extrabold tracking-tight text-slate-900 sm:text-lg">
                  Kotoba<span className="text-indigo-600">Sync</span>
                </h1>
                {syncStatus === 'firebase-live' && (
                  <span className="inline-block h-2 w-2 rounded-full bg-emerald-500" title="실시간 연동 중" />
                )}
              </div>
              <div className="flex items-center gap-1.5">
                <div className="whitespace-nowrap rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-700">
                  암기완료 {memorizedCount} / {words.length}
                </div>
                <button
                  onClick={() => setIsSettingsModalOpen(true)}
                  className="whitespace-nowrap rounded-lg border border-slate-200 bg-white px-2.5 py-1 text-xs font-semibold text-slate-700 hover:bg-slate-50"
                >
                  ⚙️ 설정
                </button>
              </div>
            </div>
          </header>

          {/* 메인 영역 */}
          <main className="mx-auto w-full max-w-7xl flex-1 space-y-3 px-3.5 pt-3 sm:px-6 lg:px-8">
            {/* 1. 상단 메인: 컴팩트한 빠른 단어 추가 바 (상단 제목 문구 제거, 화면 밖 이탈 방지, 최근 검색 단어 표시) */}
            <div className="rounded-2xl border border-indigo-500/25 bg-gradient-to-br from-indigo-50/60 via-white to-violet-50/40 p-3 shadow-xs sm:p-4">
              <div className="flex w-full items-center gap-2">
                <input
                  type="text"
                  value={addInput}
                  onChange={e => setAddInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleQuickAddSearch()}
                  placeholder="추가할 일본어 단어나 발음 입력..."
                  className="min-w-0 flex-1 rounded-xl border border-indigo-200 bg-white px-3 py-2 text-sm font-medium focus:border-indigo-600 focus:outline-none"
                />
                <button
                  onClick={() => handleQuickAddSearch()}
                  disabled={isSearchingAI || !addInput.trim()}
                  className="shrink-0 whitespace-nowrap rounded-xl bg-indigo-600 px-3.5 py-2 text-xs sm:text-sm font-bold text-white shadow-xs hover:bg-indigo-700 disabled:opacity-50"
                >
                  {isSearchingAI ? '분석중' : '+ 단어 추가'}
                </button>
              </div>

              {recentSearches.length > 0 && (
                <div className="mt-2 flex flex-wrap items-center gap-1.5">
                  <span className="text-[11px] font-semibold text-slate-400">최근 검색:</span>
                  {recentSearches.map(term => (
                    <span
                      key={term}
                      className="inline-flex items-center gap-1 rounded-full border border-slate-200 bg-white px-2.5 py-0.5 text-xs font-medium text-slate-700"
                    >
                      <button
                        type="button"
                        onClick={() => handleQuickAddSearch(term)}
                        className="hover:text-indigo-600"
                      >
                        {term}
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          const next = recentSearches.filter(item => item !== term);
                          setRecentSearches(next);
                          try {
                            localStorage.setItem('kotobasync_recent_searches_v1', JSON.stringify(next));
                          } catch {}
                        }}
                        className="text-[10px] text-slate-400 hover:text-rose-500"
                      >
                        ✕
                      </button>
                    </span>
                  ))}
                </div>
              )}

              {/* AI 후보 선택 및 즉시 저장 확장 패널 */}
              {isAddDrawerOpen && (
                <div className="mt-3 space-y-3 border-t border-indigo-100 pt-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-700">
                      {isSearchingAI ? '⏳ AI가 알맞은 일본어 단어와 예문을 생성하고 있습니다...' : 'AI 추천 후보 선택 후 저장'}
                    </span>
                    <button onClick={() => setIsAddDrawerOpen(false)} className="text-xs text-slate-400 hover:text-slate-700">✕ 닫기</button>
                  </div>
                  {isSearchingAI ? (
                    <div className="flex items-center justify-center rounded-2xl border border-dashed border-indigo-200 bg-white/80 py-8 text-xs font-semibold text-indigo-600">
                      ✨ AI가 단어와 예문을 생성하고 있습니다. 잠시만 기다려 주세요...
                    </div>
                  ) : (
                    <>
                      <div className="grid grid-cols-1 gap-2.5 sm:grid-cols-3">
                        {candidates.map((cand, idx) => (
                          <div
                            key={idx}
                            onClick={() => selectCandidate(cand, idx)}
                            className={`cursor-pointer rounded-2xl border p-3.5 transition ${selectedCandIdx === idx ? 'border-indigo-600 bg-white ring-2 ring-indigo-600/20' : 'border-slate-200 bg-white/70'}`}
                          >
                            <div className="font-jp text-xl font-extrabold text-slate-900">
                              {renderJapaneseWithFurigana(cand.kanji, { fallbackKana: cand.kana, hideFurigana })}
                            </div>
                            <p className="mt-1 text-[11px] text-slate-500">{cand.nuance}</p>
                            <div className="mt-2 space-y-1 border-t border-slate-100 pt-2">
                              {cand.meanings.map((m, mIdx) => (
                                <div key={mIdx} className="text-xs text-slate-800">
                                  <strong className="text-indigo-600">{mIdx + 1}.</strong> {m.definition} <span className="text-[10px] text-slate-400">({m.partOfSpeech})</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                      <div className="flex justify-end gap-2">
                        <button onClick={() => setIsAddDrawerOpen(false)} className="rounded-xl border bg-white px-4 py-2 text-xs font-bold text-slate-600">취소</button>
                        <button onClick={handleSaveNewWord} className="rounded-xl bg-indigo-600 px-5 py-2 text-xs font-bold text-white shadow">✓ 단어장에 바로 저장</button>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>

            {/* 2. 학습 툴바 (단어 숨기기 / 뜻 숨기기 / 후리가나 숨기기: 선택해도 무조건 1줄 고정 grid-cols-3) */}
            <div className="space-y-2.5 rounded-2xl border border-slate-200 bg-white p-3 shadow-xs sm:p-4">
              <div className="flex flex-col gap-2.5 lg:flex-row lg:items-center lg:justify-between">
                <div className="grid grid-cols-3 gap-1.5 w-full lg:w-auto">
                  <button
                    onClick={() => { setHideWord(!hideWord); setRevealedWordIds(new Set()); }}
                    className={`whitespace-nowrap rounded-xl border px-2 py-2 text-center text-xs font-bold transition ${hideWord ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}`}
                  >
                    {hideWord ? '🙈 단어 숨김' : '👁️ 단어 숨기기'}
                  </button>
                  <button
                    onClick={() => { setHideMeaning(!hideMeaning); setRevealedMeaningIds(new Set()); }}
                    className={`whitespace-nowrap rounded-xl border px-2 py-2 text-center text-xs font-bold transition ${hideMeaning ? 'bg-violet-600 text-white border-violet-600' : 'bg-white text-slate-700 border-slate-200'}`}
                  >
                    {hideMeaning ? '🙈 뜻 숨김' : '👁️ 뜻 숨기기'}
                  </button>
                  <button
                    onClick={() => setHideFurigana(!hideFurigana)}
                    className={`whitespace-nowrap rounded-xl border px-2 py-2 text-center text-xs font-bold transition ${hideFurigana ? 'bg-teal-600 text-white border-teal-600' : 'bg-white text-slate-700 border-slate-200'}`}
                  >
                    {hideFurigana ? 'あ 후리가나 숨김' : 'あ 후리가나 숨기기'}
                  </button>
                </div>

                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="단어장 내 검색 (일본어/뜻)..."
                  className="w-full lg:w-72 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-1.5 text-xs focus:border-indigo-500 focus:bg-white focus:outline-none"
                />
              </div>

              <div className="flex flex-wrap items-center justify-between gap-2 border-t border-slate-100 pt-2.5">
                <div className="flex flex-wrap gap-1.5">
                  {[
                    { id: 'all', label: `전체 (${words.length})` },
                    { id: 'learning', label: '학습중' },
                    { id: 'memorized', label: `암기완료 (${memorizedCount})` },
                    { id: 'favorite', label: '⭐ 즐겨찾기' },
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setStatusFilter(tab.id)}
                      className={`rounded-lg px-2.5 py-1 text-xs font-semibold ${statusFilter === tab.id ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                <div className="flex items-center gap-1.5">
                  <span className="text-xs font-semibold text-slate-500">정렬:</span>
                  {[
                    { id: 'latest', label: '최신순' },
                    { id: 'kana', label: '오십음도순' },
                    { id: 'status', label: '암기상태별' },
                  ].map(opt => (
                    <button
                      key={opt.id}
                      onClick={() => setSortBy(opt.id)}
                      className={`rounded-lg px-2.5 py-1 text-xs font-bold ${sortBy === opt.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                    >
                      {opt.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* 반응형 대시보드:
                - 모바일/좁은 화면(<1024px): 선택한 단어 바로 아래쪽에 상세 내용이 아코디언 형태로 펼쳐짐
                - PC 넓은 화면(>=1024px): 좌측 리스트 + 우측 고정 상세/예문/편집 패널 */}
            <div className="grid grid-cols-1 gap-6 lg:grid-cols-12 lg:items-start">
              {/* 좌측 단어 카드 리스트 */}
              <div className="space-y-3 lg:col-span-7">
                {filteredAndSortedWords.map(word => {
                  const maskW = hideWord && !revealedWordIds.has(word.id);
                  const maskM = hideMeaning && !revealedMeaningIds.has(word.id);
                  const isMemorized = word.memorization_status === 'memorized';
                  const isSelected = word.id === selectedWordId;
                  const repExample = word.meanings.find(m => m.examples && m.examples.length > 0)?.examples[0] || null;

                  return (
                    <div key={word.id} className="space-y-2">
                      <div
                        onClick={() => setSelectedWordId(prev => prev === word.id ? null : word.id)}
                        className={`cursor-pointer rounded-2xl border p-4 transition ${isSelected ? 'border-indigo-600 bg-indigo-50/20 ring-2 ring-indigo-600/15 shadow-sm' : 'border-slate-200 bg-white hover:border-indigo-300'}`}
                      >
                        <div className="mb-2.5 flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            {/* 즐겨찾기처럼 단어 리스트에서 바로 상태값을 바꾸는 원터치 버튼 */}
                            <button
                              onClick={e => {
                                e.stopPropagation();
                                updateWordItem({ ...word, memorization_status: isMemorized ? 'learning' : 'memorized' });
                              }}
                              title="클릭하여 학습중 / 암기완료 상태 즉시 변경"
                              className={`rounded-full border px-3 py-0.5 text-xs font-bold transition active:scale-95 ${
                                isMemorized
                                  ? 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100'
                                  : 'border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100'
                              }`}
                            >
                              {isMemorized ? '✅ 암기완료' : '⏳ 학습중'}
                            </button>

                            {word.meanings.length > 1 && (
                              <span className="rounded-full bg-indigo-50 px-2 py-0.5 text-[11px] font-bold text-indigo-600">
                                다의어 {word.meanings.length}개 뜻
                              </span>
                            )}
                          </div>
                          <div className="flex items-center gap-1" onClick={e => e.stopPropagation()}>
                            <button onClick={() => speakJapanese(word.kana || word.kanji)} className="rounded-lg p-1.5 text-xs hover:bg-slate-100" title="발음 듣기">🔊</button>
                            <button onClick={() => updateWordItem({ ...word, is_favorite: !word.is_favorite })} className="rounded-lg p-1.5 text-xs hover:bg-slate-100">
                              {word.is_favorite ? '⭐' : '☆'}
                            </button>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 gap-3 sm:grid-cols-12 sm:items-center">
                          <div className="sm:col-span-5">
                            {maskW ? (
                              <button
                                onClick={e => {
                                  e.stopPropagation();
                                  const next = new Set(revealedWordIds);
                                  next.add(word.id);
                                  setRevealedWordIds(next);
                                }}
                                className="w-full rounded-xl border border-dashed border-indigo-300 bg-indigo-50/60 py-3 text-xs font-bold text-indigo-700"
                              >
                                👆 터치하여 일본어 단어 확인
                              </button>
                            ) : (
                              <div className="font-jp text-2xl sm:text-[28px] font-extrabold leading-relaxed text-slate-900">
                                {renderJapaneseWithFurigana(word.kanji, { fallbackKana: word.kana, hideFurigana })}
                              </div>
                            )}
                          </div>

                          <div className="sm:col-span-7">
                            {maskM ? (
                              <button
                                onClick={e => {
                                  e.stopPropagation();
                                  const next = new Set(revealedMeaningIds);
                                  next.add(word.id);
                                  setRevealedMeaningIds(next);
                                }}
                                className="w-full rounded-xl border border-dashed border-violet-300 bg-violet-50/60 py-3 text-xs font-bold text-violet-700"
                              >
                                👆 터치하여 한국어 뜻 확인 ({word.meanings.length}개)
                              </button>
                            ) : (
                              <div className="space-y-1">
                                {word.meanings.map((m, idx) => (
                                  <div key={m.id || idx} className="text-sm">
                                    <span className="mr-1.5 inline-flex h-4 w-4 items-center justify-center rounded-full bg-slate-200 text-[11px] font-bold">{idx + 1}</span>
                                    <span className="font-bold text-slate-800">{m.definition}</span>
                                    <span className="ml-1.5 text-xs text-slate-400">[{m.partOfSpeech}]</span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>

                        {/* 카드 하단: 대표 예문 1개 표시 (한자 위에만 후리가나 루비 표기) */}
                        {repExample && (
                          <div className="mt-3 flex items-center justify-between gap-2 rounded-xl bg-slate-50 px-3.5 py-2.5 border border-slate-100">
                            <div className="space-y-0.5">
                              {!maskW ? (
                                <p className="font-jp text-xs sm:text-sm font-bold leading-relaxed text-slate-800">
                                  💬 {renderJapaneseWithFurigana(repExample.japanese, { hideFurigana })}
                                </p>
                              ) : (
                                <p className="text-xs italic text-slate-400">💬 (단어 숨김 모드)</p>
                              )}
                              {!maskM && (
                                <p className="text-xs text-slate-500 pl-5">{repExample.korean}</p>
                              )}
                            </div>
                            <button
                              onClick={e => { e.stopPropagation(); speakJapanese(repExample.japanese); }}
                              className="rounded-lg p-1 text-xs text-slate-400 hover:text-indigo-600"
                              title="대표 예문 발음 듣기"
                            >
                              🔊
                            </button>
                          </div>
                        )}
                      </div>

                      {/* 모바일/좁은 화면(lg 미만): 선택한 단어 바로 아래쪽에 상세 내용 표시 */}
                      {isSelected && (
                        <div className="pl-2 lg:hidden">
                          {renderDetailCard(word, true)}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* 우측: PC 넓은 화면(lg 이상) 전용 고정 상세 & 다의어 AI 예문 생성·편집 패널 */}
              {selectedWord && (
                <div className="hidden lg:block lg:sticky lg:top-20 lg:col-span-5">
                  {renderDetailCard(selectedWord, false)}
                </div>
              )}
            </div>
          </main>

          {/* 설정 모달 */}
          {isSettingsModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-sm">
              <div className="w-full max-w-lg rounded-3xl bg-white p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="text-base font-extrabold text-slate-900">⚙️ Firebase 실시간 연동 & Gemini AI 설정</h3>
                  <button onClick={() => setIsSettingsModalOpen(false)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <div className="space-y-3">
                  <div className="rounded-2xl border border-emerald-200 bg-emerald-50/50 p-3.5 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-extrabold text-emerald-900">🛡️ 구글 계정 보안 잠금 ({ALLOWED_OWNER_EMAIL})</span>
                      {userEmail ? (
                        <button onClick={handleGoogleLogout} className="rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-[11px] font-bold text-slate-700">로그아웃</button>
                      ) : (
                        <button onClick={handleGoogleLogin} className="rounded-lg bg-emerald-600 px-3 py-1 text-[11px] font-bold text-white">Google 로그인</button>
                      )}
                    </div>
                    <p className="text-[11px] text-slate-600">
                      {userEmail
                        ? `현재 ${userEmail} 계정으로 안전하게 인증되어 클라우드 금고에서 Gemini API 키를 자동으로 불러옵니다.`
                        : 'Gemini API 키는 코드에 노출되지 않고 Firebase 비밀 금고에 암호화·보호되어 있습니다.'}
                    </p>
                  </div>
                  <div className="rounded-2xl border border-amber-200 bg-amber-50/40 p-3.5 space-y-2.5">
                    <div className="text-xs font-extrabold text-amber-900">🔥 Google Firebase 연동 (자동 입력 완료)</div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700">Firebase Project ID</label>
                      <input value={config.firebaseProjectId || ''} onChange={e => setConfig({ ...config, firebaseProjectId: e.target.value })} placeholder="예: kotobasync" className="mt-1 w-full rounded-xl border bg-white px-3 py-2 text-xs" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700">Firebase Web API Key</label>
                      <input type="password" value={config.firebaseApiKey || ''} onChange={e => setConfig({ ...config, firebaseApiKey: e.target.value })} placeholder="AIzaSy..." className="mt-1 w-full rounded-xl border bg-white px-3 py-2 text-xs" />
                    </div>
                  </div>
                  <div className="rounded-2xl border border-slate-200 p-3.5 space-y-2">
                    <label className="block text-xs font-extrabold text-indigo-950">✨ Google Gemini API Key (클라우드 금고 자동 연동됨)</label>
                    <input type="password" value={config.geminiApiKey || ''} onChange={e => setConfig({ ...config, geminiApiKey: e.target.value })} placeholder="클라우드 금고에서 자동으로 불러옵니다" className="w-full rounded-xl border px-3 py-2 text-xs" />
                  </div>
                  <div className="rounded-2xl bg-indigo-50/60 border border-indigo-100 p-3 text-xs text-slate-600 space-y-1">
                    <div className="font-bold text-indigo-950">📱 스마트폰 바탕화면 아이콘(PWA) 추가 안내</div>
                    <div>• 아이폰(Safari): 하단 [공유] → [홈 화면에 추가]</div>
                    <div>• 갤럭시(Chrome): 우측 상단 메뉴(⋮) → [홈 화면에 추가]</div>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => {
                      const trimmed = {
                        firebaseProjectId: (config.firebaseProjectId || DEFAULT_FIREBASE_PROJECT_ID).trim(),
                        firebaseApiKey: (config.firebaseApiKey || DEFAULT_FIREBASE_API_KEY).trim(),
                        geminiApiKey: (config.geminiApiKey || '').trim(),
                      };
                      setConfig(trimmed);
                      localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(trimmed));
                      if (trimmed.geminiApiKey && dbRef.current) {
                        dbRef.current.collection('kotobasync_config').doc('admin_secrets').set(
                          { geminiApiKey: trimmed.geminiApiKey, ownerEmail: ALLOWED_OWNER_EMAIL, updatedAt: new Date().toISOString() },
                          { merge: true }
                        ).catch(() => {});
                      }
                      setIsSettingsModalOpen(false);
                      if (addInput.trim()) {
                        setTimeout(() => handleQuickAddSearch(addInput.trim()), 100);
                      }
                    }}
                    className="rounded-xl bg-indigo-600 px-5 py-2 text-xs font-bold text-white"
                  >
                    설정 저장
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
